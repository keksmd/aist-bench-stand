- name: Caddy archive
  ansible.builtin.get_url:
    url: "https://github.com/caddyserver/caddy/releases/download/v{{ caddy_version }}/caddy_{{ caddy_version }}_linux_amd64.tar.gz"
    dest: "/tmp/caddy_{{ caddy_version }}.tar.gz"
    checksum: "sha512:{{ caddy_sha512 }}"
    mode: "0644"

- name: Caddy binary
  ansible.builtin.unarchive:
    src: "/tmp/caddy_{{ caddy_version }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include: [caddy]
  notify: Restart caddy

- name: Caddy user
  ansible.builtin.user:
    name: caddy
    system: true
    home: /var/lib/caddy
    shell: /usr/sbin/nologin

- name: Password hashes for the stand users
  ansible.builtin.command:
    cmd: /usr/local/bin/caddy hash-password --plaintext "{{ lookup('file', item.password_file) }}"
  loop: "{{ stand_users }}"
  register: user_hashes
  changed_when: false
  no_log: true

- name: Caddy config directory
  ansible.builtin.file:
    path: /etc/caddy
    state: directory
    mode: "0755"

- name: Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    mode: "0640"
    group: caddy
  notify: Restart caddy
  no_log: true

- name: Caddy service
  ansible.builtin.template:
    src: caddy.service.j2
    dest: /etc/systemd/system/caddy.service
    mode: "0644"
  notify: Restart caddy

- name: Firewall allows HTTP and HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["80", "443"]

- name: Caddy enabled
  ansible.builtin.systemd:
    name: caddy
    state: started
    enabled: true
    daemon_reload: true
