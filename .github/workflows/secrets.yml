name: sync-secrets

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: [self-hosted, aist-stand]
    steps:
      - name: Write the API keys the worker reads at every run
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_API_KEY_2: ${{ secrets.ZAI_API_KEY_2 }}
        run: |
          umask 077
          tmp=$(mktemp "$STAND_SECRETS_FILE.XXXX")
          for k in ZAI_API_KEY ZAI_API_KEY_2; do
            v="${!k}"
            if [ -n "$v" ]; then printf '%s=%s\n' "$k" "$v" >> "$tmp"; fi
          done
          mv "$tmp" "$STAND_SECRETS_FILE"
          cut -d= -f1 "$STAND_SECRETS_FILE"
