name: bench

on:
  workflow_dispatch:
    inputs:
      bench:
        description: Benchmark id (file in benchmarks/)
        required: true
        default: drift
      mas:
        description: MAS id (file in mas/)
        required: true
        default: t11
      params:
        description: Space-separated key=value overrides, for example "provider=glm45 n_tasks=5"
        required: false
        default: ""
      ref:
        description: MAS commit or branch instead of the declared one (empty = declared)
        required: false
        default: ""

jobs:
  run:
    runs-on: [self-hosted, aist-stand]
    timeout-minutes: 1440
    steps:
      - name: Queue the run and wait for it
        env:
          BENCH: ${{ inputs.bench }}
          MAS: ${{ inputs.mas }}
          PARAMS: ${{ inputs.params }}
          REF: ${{ inputs.ref }}
          NOTE: "GitHub Actions run ${{ github.run_id }} by ${{ github.actor }}"
        run: |
          cd "$STAND_APP"
          args=()
          for kv in $PARAMS; do args+=(--set "$kv"); done
          [ -n "$REF" ] && args+=(--ref "$REF")
          "$STAND_PY" -m stand submit "$BENCH" --mas "$MAS" --note "$NOTE" --wait "${args[@]}" | tee "$RUNNER_TEMP/result.txt"
          run_id=$(head -1 "$RUNNER_TEMP/result.txt")
          echo "Run \`$run_id\`: https://93.189.228.196/#/run/$run_id" >> "$GITHUB_STEP_SUMMARY"
          tail -1 "$RUNNER_TEMP/result.txt" >> "$GITHUB_STEP_SUMMARY"
