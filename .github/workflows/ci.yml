name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pip install -r requirements.txt httpx ansible-core
      - run: python3 -m stand validate
      - run: python3 -m unittest discover -s tests -t . -v
      - run: ansible-galaxy collection install community.general
      - run: ansible-playbook -i inventory/stand.yml ansible/site.yml --syntax-check
